{% extends "base.html" %}
{% block title %}PR Not Found{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 80px 24px; text-align: center; max-width: 600px; margin: 0 auto;">
  <div style="margin-bottom: 16px; color: var(--color-fg-muted);">
    <svg width="48" height="48" viewBox="0 0 16 16" fill="currentColor">
      <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
    </svg>
  </div>
  <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 8px; color: var(--color-fg-default);">Pull Request Not Found</h1>
  <p style="color: var(--color-fg-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5;">
    {{ message or "The requested pull request could not be located in the local cache or fetched from GitHub." }}
  </p>
  <div style="display: flex; gap: 12px; justify-content: center;">
    <a href="/repos" class="gh-btn gh-btn-primary">Return to Repositories</a>
    <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="gh-btn">Search GitHub</a>
  </div>
</div>
{% endblock %}
