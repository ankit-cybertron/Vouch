name: Deploy to AWS Elastic Beanstalk

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-eb:
    name: Deploy Vouch Web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web dependencies (Validation)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt

      - name: Prepare Elastic Beanstalk deployment package
        run: |
          # Overwrite requirements.txt in deployment package with requirements-web.txt
          # to ensure Elastic Beanstalk does not attempt to download heavy ML packages
          cp requirements-web.txt requirements.txt
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "temp/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: vouch
          environment_name: vouch-prod
          region: ap-south-1
          version_label: vouch-${{ github.event.workflow_run.head_sha }}
          deployment_package: deploy.zip
